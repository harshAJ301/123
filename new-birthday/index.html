<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100719">
<title>Nisha's 19th Birthday — The Birthday Quest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100719}
.opening{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:#100719;isolation:isolate}
.backdrop{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(18px) brightness(.42) saturate(1.35);opacity:.85;z-index:-2;transform:scale(1.05);animation:backdropDrift 24s ease-in-out infinite alternate}
.frame{position:absolute;left:50%;top:50%;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);height:min(100dvh,56.25vw);aspect-ratio:16/9;transform:translate(-50%,-50%);overflow:hidden;isolation:isolate;animation:sceneDrift 18s ease-in-out infinite alternate}
.art{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:fill;z-index:-1}
.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 70% 20%,transparent 25%,rgba(8,3,18,.08) 72%,rgba(8,3,18,.22));z-index:1}
.moon-glow{position:absolute;left:58%;top:-9%;width:24%;aspect-ratio:1;border-radius:50%;background:#ff82e5;opacity:.2;filter:blur(25px);animation:moonPulse 4.5s ease-in-out infinite;pointer-events:none}
.river-shimmer{position:absolute;left:64%;top:38%;width:25%;height:64%;transform:rotate(16deg);background:linear-gradient(90deg,transparent,rgba(255,91,220,.05) 25%,rgba(255,179,239,.42) 49%,rgba(255,55,206,.13) 56%,transparent 78%);filter:blur(5px);animation:riverFlow 5s ease-in-out infinite alternate;pointer-events:none}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff2ff;box-shadow:0 0 7px 2px #ff68e6;opacity:0;animation:twinkle var(--duration,3s) var(--delay,0s) ease-in-out infinite}
.petal{position:absolute;width:10px;height:15px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#ffb2ed,#f31bb7 65%,#9b1dd4);box-shadow:0 0 9px #ff38d766;opacity:0;animation:petalFloat var(--duration,9s) var(--delay,0s) linear infinite;pointer-events:none}
.begin-hit{position:absolute;left:36.5%;top:81.5%;width:25.5%;height:10.5%;border:0;border-radius:18px;background:transparent;cursor:pointer;touch-action:manipulation;z-index:3}
.begin-hit:focus-visible{outline:3px solid #ffd4fb;outline-offset:4px;box-shadow:0 0 22px #ff38d7}
.begin-hit:active{background:rgba(255,68,216,.13)}
.toast{position:absolute;left:50%;bottom:3%;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:12px 18px;border:1px solid #ff83e9;border-radius:10px;background:#170820f2;color:#fff1ff;font:500 15px system-ui,sans-serif;box-shadow:0 0 24px #ff38d755;transition:opacity .25s,transform .25s;text-align:center;width:max-content;max-width:90%;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes sceneDrift{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(calc(-50% - 4px),calc(-50% + 2px)) scale(1.025)}}
@keyframes backdropDrift{0%{transform:scale(1.05) translate(-1%,0)}100%{transform:scale(1.13) translate(1%,-1%)}}
@keyframes moonPulse{0%,100%{opacity:.13;transform:scale(.92)}50%{opacity:.34;transform:scale(1.08)}}
@keyframes riverFlow{0%{opacity:.35;translate:-7px -3px}100%{opacity:.8;translate:8px 5px}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}45%,65%{opacity:.9;transform:scale(1.25)}}
@keyframes petalFloat{0%{opacity:0;transform:translate3d(0,20px,0) rotate(0deg)}10%{opacity:.9}55%{transform:translate3d(22px,-220px,0) rotate(170deg)}90%{opacity:.75}100%{opacity:0;transform:translate3d(-12px,-420px,0) rotate(310deg)}}
@media(prefers-reduced-motion:reduce){.backdrop,.frame,.moon-glow,.river-shimmer,.spark,.petal{animation:none!important}.spark{opacity:.45}.petal{opacity:.15}}
</style>
</head>
<body>
<main class="opening" aria-label="Nisha's birthday opening screen">
<img class="backdrop" src="1000005863-1.png" alt="" aria-hidden="true">
<div class="frame" id="frame">
<img class="art" id="openingArt" src="1000005863-1.png" alt="Nisha's 19th Birthday — The Opening Cinematic" fetchpriority="high">
<div class="moon-glow"></div><div class="river-shimmer"></div>
<button class="begin-hit" id="begin" aria-label="Begin the quest" title="Begin the quest"></button>
</div>
<div class="toast" id="status" role="status" aria-live="polite"></div>
</main>
<script>
const art=document.getElementById('openingArt');
const frame=document.getElementById('frame');
const status=document.getElementById('status');
function addAtmosphere(){
 for(let i=0;i<42;i++){
  const s=document.createElement('i');s.className='spark';
  s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';
  s.style.setProperty('--delay',(Math.random()*5)+'s');s.style.setProperty('--duration',(2+Math.random()*4)+'s');
  frame.appendChild(s);
 }
 for(let i=0;i<13;i++){
  const p=document.createElement('i');p.className='petal';
  p.style.left=(Math.random()*100)+'%';p.style.top=(55+Math.random()*65)+'%';
  p.style.setProperty('--delay',(Math.random()*10)+'s');p.style.setProperty('--duration',(8+Math.random()*8)+'s');
  p.style.transform='scale('+(0.55+Math.random()*.8)+')';
  frame.appendChild(p);
 }
}
addAtmosphere();
document.getElementById('begin').addEventListener('click',()=>{
 status.textContent='Quest accepted ✨ Your adventure begins here.';
 status.classList.add('show');
});
art.addEventListener('error',()=>{
 status.textContent='The image could not load. Check that 1000005863-1.png is in this folder.';
 status.classList.add('show');
});
</script>
</body>
</html>
