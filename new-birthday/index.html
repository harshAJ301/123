<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100719">
<title>Nisha's 19th Birthday — The Birthday Quest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100719}
.opening{position:relative;width:100%;height:100%;height:100dvh;display:grid;place-items:center;overflow:hidden;background:#100719}
.art{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.begin-hit{position:absolute;left:37.5%;top:81.5%;width:24%;height:11%;border:0;border-radius:18px;background:transparent;cursor:pointer;touch-action:manipulation}
.begin-hit:focus-visible{outline:3px solid #ffd4fb;outline-offset:4px;box-shadow:0 0 22px #ff38d7}
.toast{position:absolute;left:50%;bottom:3%;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:12px 18px;border:1px solid #ff83e9;border-radius:10px;background:#170820f2;color:#fff1ff;font:500 15px system-ui,sans-serif;box-shadow:0 0 24px #ff38d755;transition:opacity .25s,transform .25s;text-align:center;width:max-content;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-aspect-ratio:4/5){.art{width:100%;height:100%;object-fit:cover;object-position:center}.begin-hit{left:35%;top:80%;width:31%;height:12%}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main class="opening" aria-label="Nisha's birthday opening screen">
<img class="art" src="opening.jpg" alt="Nisha's 19th Birthday — The Opening Cinematic" fetchpriority="high">
<button class="begin-hit" id="begin" aria-label="Begin the quest" title="Begin the quest"></button>
<div class="toast" id="status" role="status" aria-live="polite"></div>
</main>
<script>
const status=document.getElementById('status');
document.getElementById('begin').addEventListener('click',()=>{
 status.textContent='Quest accepted ✨ The next chapter will be added when you approve it.';
 status.classList.add('show');
});
document.querySelector('.art').addEventListener('error',()=>{
 status.textContent='Opening artwork not found. Add the exact image as new-birthday/opening.jpg.';
 status.classList.add('show');
});
</script>
</body>
</html>
