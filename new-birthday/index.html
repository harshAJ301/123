.map-step.active{animation:stepPulse 1.65s ease-in-out infinite}
.map-node:not(.locked) .node-icon{position:relative}
.map-node:not(.locked) .node-icon:before{content:"";position:absolute;inset:-7px;border:1px solid #ff8fe8;border-radius:50%;opacity:0;animation:portalRing 2.6s ease-out infinite;pointer-events:none}
.map-bottom{box-shadow:0 0 22px #e633d533,inset 0 0 24px #d64ae40b}
.map-counter{animation:counterGlow 4s ease-in-out infinite}
.map-scene:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffd7fb08 47%,transparent 64%);background-size:230% 100%;animation:lightSweep 12s linear infinite}
@keyframes mapCameraDrift{0%{transform:scale(1);filter:saturate(1)}100%{transform:scale(1.025);filter:saturate(1.12)}}
@keyframes nebulaBreathe{0%{opacity:.7;transform:translate3d(-1%,0,0) scale(.98)}100%{opacity:1;transform:translate3d(1%,-1%,0) scale(1.04)}}
@keyframes currentLevelPulse{0%,100%{filter:brightness(.95);transform:scale(.97);box-shadow:0 0 0 4px #ff4acb22,0 0 16px #ff4acb88}50%{filter:brightness(1.35);transform:scale(1.07);box-shadow:0 0 0 9px #ff4acb12,0 0 31px #ff4acbcc}}
@keyframes stepPulse{0%,100%{box-shadow:0 0 12px #ff48d977;filter:brightness(1)}50%{box-shadow:0 0 25px #ff48d9,0 0 40px #ff48d966;filter:brightness(1.18)}}
@keyframes portalRing{0%{transform:scale(.8);opacity:.65}100%{transform:scale(1.65);opacity:0}}
@keyframes counterGlow{0%,100%{box-shadow:0 0 18px #e72bdb35}50%{box-shadow:0 0 28px #e72bdb70}}
@keyframes lightSweep{0%{background-position:150% 0}100%{background-position:-150% 0}}
@media(prefers-reduced-motion:reduce){.map-art,.map-nebula,.map-node.current .node-icon,.map-step.active,.map-counter,.map-scene:after,.map-node:not(.locked) .node-icon:before{animation:none!important}}


/* The user's actual 5-second map video is the map page */
.video-map-page{padding:0!important;overflow:hidden;background:#070510}
.video-map-page.active{display:flex!important;align-items:stretch;justify-content:stretch}
.video-map-stage{position:relative;display:flex;width:100%;height:100%;min-height:100%;align-items:center;justify-content:center;overflow:hidden;background:#070510}
.mystery-map-video{display:block;width:100%;height:100%;object-fit:contain;background:#070510}
.video-map-controls{position:absolute;z-index:12;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:12px;padding:0 clamp(12px,2.5vw,30px);pointer-events:none}
.video-control{pointer-events:auto;border:1px solid #f29be9;border-radius:999px;padding:10px 15px;background:#16091fdc;color:#fff1ff;font:600 12px system-ui,sans-serif;letter-spacing:.08em;box-shadow:0 0 18px #f43bd655;backdrop-filter:blur(8px);cursor:pointer}
.video-control:active{transform:scale(.97)}
.video-missing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;background:#100719;color:#ffeaff;font:16px system-ui,sans-serif}
.video-missing[hidden]{display:none}
.video-missing strong{font:700 25px Georgia,serif;color:#ffb3f1}
.video-missing span{max-width:430px;line-height:1.5}
.video-missing code{color:#ffc3f6}
@media(max-width:650px){.mystery-map-video{width:100%;height:100%;object-fit:contain}.video-control{font-size:10px;padding:9px 12px}}

</style>
</head>
<body>
<main class="opening" aria-label="Nisha's birthday opening screen">
<img class="backdrop" src="1000005863-1.png" alt="" aria-hidden="true">
<div class="frame" id="frame">
<img class="art" id="openingArt" src="1000005863-1.png" alt="Nisha's 19th Birthday — The Opening Cinematic" fetchpriority="high">
<div class="moon-glow"></div><div class="river-shimmer"></div><svg class="character-motion" viewBox="0 0 1536 864" preserveAspectRatio="none" aria-hidden="true">
 <defs>
  <filter id="pinkGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="hairShine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb6f0" stop-opacity="0"/><stop offset=".5" stop-color="#ff7fe1" stop-opacity=".8"/><stop offset="1" stop-color="#ffb6f0" stop-opacity="0"/></linearGradient>
 </defs>
 <!-- tiny glints drifting along the girl's hair edge -->
 <g class="hair-glints" fill="none" stroke="url(#hairShine)" stroke-width="2.5" stroke-linecap="round" filter="url(#pinkGlow)">
  <path d="M163 477 Q128 550 118 625 T130 735"/>
  <path d="M190 525 Q162 602 172 682 T203 786"/>
  <path d="M315 450 Q352 510 361 577 T398 677"/>
 </g>
 <!-- soft moving light on the bow, without covering its artwork -->
 <ellipse class="bow-glow" cx="238" cy="344" rx="47" ry="34" fill="#ff83e8"/>
 <!-- window glows on the castle -->
 <g class="castle-lights" fill="#ff9bdf" filter="url(#pinkGlow)">
  <ellipse cx="1070" cy="120" rx="7" ry="13"/><ellipse cx="1110" cy="166" rx="6" ry="12"/>
  <ellipse cx="1040" cy="224" rx="6" ry="11"/><ellipse cx="1097" cy="240" rx="8" ry="14"/>
  <ellipse cx="1005" cy="285" rx="5" ry="10"/><ellipse cx="1139" cy="287" rx="5" ry="10"/>
 </g>
 <!-- lantern flicker glow -->
 <ellipse class="lantern-glow" cx="1067" cy="758" rx="47" ry="58" fill="#ffad48"/>
 <!-- an animated tail-shaped overlay following the cat silhouette -->
 <path class="cat-tail" d="M1222 767 C1260 789 1284 765 1273 739 C1267 726 1256 727 1253 740" fill="none" stroke="#10091a" stroke-width="17" stroke-linecap="round"/>
 <path class="cat-tail-highlight" d="M1222 763 C1257 784 1279 763 1269 740" fill="none" stroke="#5e2c64" stroke-width="3.5" stroke-linecap="round"/>
</svg>
<button class="begin-hit" id="begin" aria-label="Begin the quest" title="Begin the quest"></button>
</div>

<section class="chapter-two video-map-page" id="chapterTwo" aria-label="Nisha's animated mystery map">
 <div class="video-map-stage">
  <video id="mysteryMapVideo" class="mystery-map-video" src="birthday-map.mp4" autoplay muted loop playsinline preload="auto" aria-label="Animated mystery map for Nisha's birthday"></video>
  <div class="video-missing" id="videoMissing" hidden>
   <strong>Almost there!</strong>
   <span>Upload your video into this folder as <code>birthday-map.mp4</code> to show it here.</span>
  </div>
  <div class="video-map-controls">
   <button class="video-control" id="mapSoundToggle" type="button" aria-label="Turn video sound on">🔇 SOUND OFF</button>
   <button class="video-control" id="backToOpening" type="button">← OPENING</button>
  </div>
 </div>
</section>
<div class="toast" id="status" role="status" aria-live="polite"></div>
</main>
<script>
const art=document.getElementById('openingArt');
const frame=document.getElementById('frame');
const status=document.getElementById('status');
function addAtmosphere(){
 for(let i=0;i<42;i++){
  const s=document.createElement('i');s.className='spark';
  s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';
  s.style.setProperty('--delay',(Math.random()*5)+'s');s.style.setProperty('--duration',(2+Math.random()*4)+'s');
  frame.appendChild(s);
 }
 for(let i=0;i<13;i++){
  const p=document.createElement('i');p.className='petal';
  p.style.left=(Math.random()*100)+'%';p.style.top=(55+Math.random()*65)+'%';
  p.style.setProperty('--delay',(Math.random()*10)+'s');p.style.setProperty('--duration',(8+Math.random()*8)+'s');
  p.style.transform='scale('+(0.55+Math.random()*.8)+')';
  frame.appendChild(p);
 }
}
addAtmosphere();
const chapterTwo=document.getElementById('chapterTwo');
const mapVideo=document.getElementById('mysteryMapVideo');
const videoMissing=document.getElementById('videoMissing');
function showMap(){
 frame.style.display='none';
 chapterTwo.classList.add('active');
 status.classList.remove('show');
 if(mapVideo){mapVideo.currentTime=0;const playPromise=mapVideo.play();if(playPromise&&playPromise.catch)playPromise.catch(()=>{});}
}
function showOpening(){
 chapterTwo.classList.remove('active');
 frame.style.display='block';
 if(mapVideo)mapVideo.pause();
}
document.getElementById('begin').addEventListener('click',showMap);
document.getElementById('backToOpening').addEventListener('click',showOpening);
if(mapVideo){
 mapVideo.addEventListener('error',()=>{videoMissing.hidden=false;});
 document.getElementById('mapSoundToggle').addEventListener('click',()=>{
  mapVideo.muted=!mapVideo.muted;
  const b=document.getElementById('mapSoundToggle');
  b.textContent=mapVideo.muted?'🔇 SOUND OFF':'🔊 SOUND ON';
  b.setAttribute('aria-label',mapVideo.muted?'Turn video sound on':'Mute video sound');
  if(!mapVideo.paused){const p=mapVideo.play();if(p&&p.catch)p.catch(()=>{});}
 });
}
art.addEventListener('error',()=>{
 status.textContent='The image could not load. Check that 1000005863-1.png is in this folder.';
 status.classList.add('show');
});
</script>
</body>
</html>
