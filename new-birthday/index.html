@keyframes nebulaBreathe{0%{opacity:.7;transform:translate3d(-1%,0,0) scale(.98)}100%{opacity:1;transform:translate3d(1%,-1%,0) scale(1.04)}}

@keyframes lightSweep{0%{background-position:150% 0}100%{background-position:-150% 0}}
@media(prefers-reduced-motion:reduce){.map-art,.map-nebula,.map-node.current .node-icon,.map-step.active,.map-counter,.map-scene:after,.map-node:not(.locked) .node-icon:before{animation:none!important}}

<script>
const art=document.getElementById('openingArt');
const frame=document.getElementById('frame');
const status=document.getElementById('status');
function addAtmosphere(){
 for(let i=0;i<42;i++){
  const s=document.createElement('i');s.className='spark';
  s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';
  s.style.setProperty('--delay',(Math.random()*5)+'s');s.style.setProperty('--duration',(2+Math.random()*4)+'s');
  frame.appendChild(s);
 }
 for(let i=0;i<13;i++){
  const p=document.createElement('i');p.className='petal';
  p.style.left=(Math.random()*100)+'%';p.style.top=(55+Math.random()*65)+'%';
  p.style.setProperty('--delay',(Math.random()*10)+'s');p.style.setProperty('--duration',(8+Math.random()*8)+'s');
  p.style.transform='scale('+(0.55+Math.random()*.8)+')';
  frame.appendChild(p);
 }
}
addAtmosphere();
const chapterTwo=document.getElementById('chapterTwo');
function showMap(){frame.style.display='none';chapterTwo.classList.add('active');status.classList.remove('show');}
function showOpening(){chapterTwo.classList.remove('active');frame.style.display='block';}
document.getElementById('begin').addEventListener('click',showMap);
document.getElementById('backToOpening').addEventListener('click',showOpening);
const mapToast=document.getElementById('mapToast');
let mapToastTimer;
function mapMessage(message){mapToast.textContent=message;mapToast.classList.add('show');clearTimeout(mapToastTimer);mapToastTimer=setTimeout(()=>mapToast.classList.remove('show'),2600);}
const destinations={
 opening:'The opening cinematic is complete ✨',
 map:'You are already exploring the Mystery Map.',
 evidence:'Evidence Room selected. The next mission will be built here.',
 puzzle:'Puzzle Chamber is locked. Collect clues to unlock it.',
 game:'Mini Game is locked. Your adventure continues soon!',
 roast:'Roast Room is locked. The friendly chaos comes later 😈',
 memories:'Memory Vault is locked. A little nostalgia awaits 💌',
 camera:'Camera Celebration is locked. Photo magic awaits 📸',
 secret:'Secret Room is locked. Keep exploring 🔐',
 final:'Final Reveal is locked. Find the nine clues first 🎂'
};
const completedSteps=new Set([1]);
function selectNode(id){
 const node=document.querySelector('[data-destination="'+id+'"]');
 if(!node)return;
 if(node.classList.contains('locked')){mapMessage(destinations[id]);return;}
 document.querySelectorAll('.map-node').forEach(n=>n.classList.remove('current'));
 node.classList.add('current');
 mapMessage(destinations[id]);
}
document.querySelectorAll('.map-node').forEach(n=>n.addEventListener('click',()=>selectNode(n.dataset.destination)));
document.querySelectorAll('.map-step').forEach(b=>b.addEventListener('click',()=>{
 const n=Number(b.dataset.step);
 if(n>2){mapMessage(destinations[({3:'evidence',4:'puzzle',5:'game',6:'roast',7:'memories',8:'camera',9:'secret',10:'final'})[n]]);return;}
 document.querySelectorAll('.map-step').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 if(n===1)showOpening();else mapMessage('You are here: The Mystery Map.');
}));
document.getElementById('mapPrev').addEventListener('click',showOpening);
document.getElementById('mapNext').addEventListener('click',()=>mapMessage('Next mission: Evidence Room. Coming up after this map.'));
art.addEventListener('error',()=>{
 status.textContent='The image could not load. Check that 1000005863-1.png is in this folder.';
 status.classList.add('show');
});
</script>
